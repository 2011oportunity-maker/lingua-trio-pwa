name: Build Flutter Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Regenerate Official Android Scaffolding
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.linguatrio --project-name lingua_trio_flutter
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true
            sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' android/app/build.gradle || true
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts || true
            sed -i 's/minSdk = [0-9]*/minSdk = 21/g' android/app/build.gradle.kts || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          flutter build apk --release --verbose
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/LinguaTrio-release.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LinguaTrio-Flutter-APK
          path: dist/LinguaTrio-release.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: flutter-apk-latest
          name: "LinguaTrio Flutter APK (Latest Release)"
          body: "Direct download link for LinguaTrio native Flutter APK for Android. Multi-level CEFR (A1-C1) for English, Romanian, and Russian. 100% free, unlimited hearts, offline persistence."
          files: dist/LinguaTrio-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
