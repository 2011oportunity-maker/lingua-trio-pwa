name: Build Flutter Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/LinguaTrio-release.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LinguaTrio-Flutter-APK
          path: dist/LinguaTrio-release.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: flutter-apk-latest
          name: "LinguaTrio Flutter APK (Latest Release)"
          body: "Direct download link for LinguaTrio native Flutter APK for Android. Fast 60-120fps performance, completely offline, zero ads or limitations."
          files: dist/LinguaTrio-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
