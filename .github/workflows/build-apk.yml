name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build LinguaTrio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync web assets into Android
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html manifest.json android/app/src/main/assets/www/
          cp -r css js icons android/app/src/main/assets/www/

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/LinguaTrio.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LinguaTrio-Android-APK
          path: dist/LinguaTrio.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: android-apk-latest
          name: "LinguaTrio Android APK (Latest)"
          body: "Direct download link for LinguaTrio Android APK. Download and install directly on your Android phone."
          files: dist/LinguaTrio.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
